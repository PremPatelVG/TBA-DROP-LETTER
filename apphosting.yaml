# Firebase App Hosting settings for the backend "tba-drop-letter" (see README, "Go live: step by step").
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0      # no cost while nobody uses the app; the first visit after a quiet spell takes a few seconds
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Use Firebase (Google sign-in + Firestore) instead of the built-in demo data.
  - variable: NEXT_PUBLIC_USE_MOCK
    value: "false"
    availability: [BUILD, RUNTIME]

  # The Firebase web settings (API key, project ID, app ID) come from the web app linked to this backend,
  # through FIREBASE_WEBAPP_CONFIG, so they are not repeated here. Values set here win over them.

  # Sign-in on phones (redirect sign-in): set this to the app's own address, without https://, once you know it,
  # for example tba-drop-letter--your-project-id.<region>.hosted.app or drop.yourcompany.in. See README, go-live step 9.
  # - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  #   value: your-app-domain.example
  #   availability: [BUILD]

  # Welcome emails for advisors and regional accounts (README, "Email (SMTP) setup"). When an advisor or a regional
  # account is added they are emailed their login, the app link and how to add it to the home screen, from
  # indiaops@tbaindia.in. The non-secret settings below are the recommended Google Workspace config; the password is a Secret Manager secret (see SMTP_PASS). If SMTP_PASS or APP_URL is
  # unset, accounts are still created and the email is skipped with a short note. Change these to match your mail
  # provider if you are not using the indiaops@tbaindia.in Google Workspace mailbox.
  - variable: SMTP_HOST
    value: smtp.gmail.com
    availability: [RUNTIME]
  - variable: SMTP_PORT
    value: "587"            # 587 = STARTTLS (SMTP_SECURE off); 465 = implicit TLS (SMTP_SECURE "true")
    availability: [RUNTIME]
  - variable: SMTP_SECURE
    value: "false"
    availability: [RUNTIME]
  - variable: SMTP_USER
    value: indiaops@tbaindia.in
    availability: [RUNTIME]
  - variable: MAIL_FROM
    value: indiaops@tbaindia.in
    availability: [RUNTIME]
  # The SMTP password is a SECRET (a Google App Password): it lives in Cloud Secret Manager and is referenced by
  # name here — NEVER put the password in this file. Before the first deploy, create it once with:
  #   firebase apphosting:secrets:set SMTP_PASS
  # then grant the backend access if prompted. Docs: https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  - variable: SMTP_PASS
    secret: SMTP_PASS
    availability: [RUNTIME]
  # The app's web address that welcome emails link to. There is no Play Store, App Store or APK: people open this
  # link on their phone and add it to the home screen (Android: Install app; iPhone: Share, Add to Home Screen). PLACEHOLDER:
  # replace with the app's real address (your custom domain, or the *.hosted.app URL) and redeploy.
  - variable: APP_URL
    value: https://app.tbaindia.in
    availability: [RUNTIME]
