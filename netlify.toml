# The LIVE app on Netlify: the real Next.js app (pages + server actions) on Netlify's Next.js runtime, with Firebase
# for sign-in and data. The settings (Firebase web app, server credentials, email) are environment variables set in
# the Netlify UI, never in this file: see README, "Go live: step by step", step 7. The build checks them first and a
# production deploy stops if the Firebase settings are missing (scripts/netlify-build.mjs).
#
# The clickable demo with sample data (tba-drop-letter-demo) does NOT use this file: build it with
# `npm run build:demo` and deploy the preview/dist-demo folder (README, "Demo site on Netlify").
[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_USE_MOCK = "false"
